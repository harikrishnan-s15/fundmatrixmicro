# Test profile — isolated in-memory H2, no demo seeding, schema created fresh per run.
spring:
  datasource:
    url: jdbc:h2:mem:fundmatrix-test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop

fundmatrix:
  seed:
    enabled: false
