
spring.application.name=fundmatrix


spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration










# ---- Datasource: MySQL 8 -----------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/fund_matrix_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---- JPA / Hibernate ---------------------------------------------------------
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ---- Jackson -----------------------------------------------------------------
spring.jackson.default-property-inclusion=non_null
spring.jackson.serialization.write-dates-as-timestamps=false

# ---- Server ------------------------------------------------------------------
server.port=${SERVER_PORT:8082}
server.servlet.context-path=/api
server.error.include-message=always

# ---- OpenAPI / Swagger UI ----------------------------------------------------
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.api-docs.path=/v3/api-docs

fundmatrix.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:3000,http://127.0.0.1:5173,http://127.0.0.1:5174}
# standard equity/debt subscription cut-off (3:00 PM); liquid/overnight 1:30 PM
fundmatrix.operations.cutoff-time=15:00
fundmatrix.operations.liquid-cutoff-time=13:30
fundmatrix.operations.unit-scale=4
fundmatrix.operations.amount-scale=2
# % TDS applied on gross dividend (internally configured)
fundmatrix.tax.dividend-tds-rate=10.0
# load demo data on first start (empty DB only)
fundmatrix.seed.enabled=${SEED_ENABLED:true}

# ---- Logging -----------------------------------------------------------------
logging.level.com.fundmatrix=INFO
logging.level.org.hibernate.SQL=WARN
